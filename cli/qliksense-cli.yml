repo: https://github.com/qlik-oss/qlik-cli
description: 'qlik-cli is Qlik''s first-party command-line tool for Qlik Cloud. It is generated from the same API
  specifications as the REST surface, so its command tree tracks the API resource-by-resource: 1,018 documented
  command pages across 60+ top-level resource groups. It is also one of only two places Qlik implements rate-limit
  handling and automatic pagination for the caller.'
name: qlik
official: true
language: go
license: open source (qlik-oss)
version: v3.3.0
released: '2026-08-14'
install:
- method: homebrew
  command: brew install qlik-oss/taps/qlik-cli
  platforms:
  - macos
  - linux
- method: github-release
  command: download the signed binary from https://github.com/qlik-oss/qlik-cli/releases
  platforms:
  - macos
  - linux
  - windows
authentication:
  methods:
  - api-key
  - oauth2-m2m
  - jwt
  context_model: named contexts (qlik context create/use) hold tenant URL plus credentials
  docs: https://qlik.dev/authenticate/oauth/oauth-connect-qlik-cli/
notable_behaviour:
- name: automatic pagination
  detail: qlik-cli follows links.next in the background when listing resources; direct HTTP callers must do this
    themselves.
  docs: https://qlik.dev/toolkits/qlik-cli/qlik-cli-pagination
- name: rate-limit handling
  detail: Built-in 429/Retry-After handling. Qlik names qlik-cli and the Qlik Automate connectors as the only two
    toolkits that do this for you.
  docs: https://qlik.dev/apis/rest/rate-limiting/
- name: namespace commands
  detail: qlik-cli 3.0.0 added namespace command support, tracking the /api/<namespace>/ migration.
  docs: https://qlik.dev/changelog/
- name: aliases
  detail: qlik alias add/ls/rm/update for user-defined command shortcuts.
- name: shell completion
  detail: qlik completion for bash/zsh/fish/powershell.
