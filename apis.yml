- aid: qliksense:mcp-server
  name: Qlik MCP Server
  description: Qlik's first-party remote Model Context Protocol server, generally available since 2026-02-10
    and included from the Starter plan up. It exposes Qlik Cloud analytics — datasets and data quality,
    data products, lineage, business glossary, app discovery and metadata, data exploration, master items,
    selections and filtering, visualizations and sheets — as MCP tools to any MCP-capable assistant. OAuth
    2.0 only; every call is bound to a verified Qlik user and governed by the same space, role and Section
    Access controls as the product.
  humanURL: https://www.qlik.com/us/products/model-context-protocol
  baseURL: https://{tenant}.{region}.qlikcloud.com/api/ai/mcp
