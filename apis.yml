aid: qliksense
name: Qlik Sense APIs
description: 'Qlik Sense and Qlik Cloud from Qlik Parent, Inc. — a business intelligence, data integration
  and AI analytics platform. Qlik publishes one of the broadest machine-readable API surfaces in the analytics
  market: 78 OpenAPI 3.0.0 documents covering 681 REST operations, 29 AsyncAPI 3.0.0 event documents carrying
  CloudEvents 1.0 payloads, an OpenRPC 1.0.0 document for the QIX Associative Engine WebSocket API, 39
  JSON Schemas for Qlik Talend Cloud declarative pipelines, and a proto3 gRPC contract for the engine''s
  Server-Side Extension protocol. It also ships a generally-available remote MCP server at <tenant>/api/ai/mcp
  and maintains a public Agent Skills hub. Every API is tenant-scoped to https://{tenant}.{region}.qlikcloud.com
  and authenticated with an API key, an OAuth 2.0 token or a signed JWT.'
type: Index
