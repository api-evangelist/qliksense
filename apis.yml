- aid: qliksense:system-events
  name: Qlik Cloud System Events
  description: 'The Qlik Cloud tenant event surface: 29 AsyncAPI 3.0.0 documents covering 102 message
    definitions across apps, reloads, spaces, tenants, users, roles, licenses, quotas, OAuth clients,
    data-integration projects, scheduling tasks and the AI/MCP channel. Payloads are CloudEvents 1.0 with
    Qlik userid/tenantid extensions, delivered to subscribers by the Webhooks API and signed with HMAC-SHA256.'
