- aid: qliksense:server-side-extension
  name: Qlik Server-Side Extension Protocol
  description: gRPC/protobuf contract for extending the Qlik Associative Engine with external compute.
    A plugin implements the qlik.sse.Connector service and the engine calls out to it for scalar, aggregation
    and tensor functions and for script evaluation, which is how R and Python models are called from a
    Qlik load script or chart expression.
  humanURL: https://github.com/qlik-oss/server-side-extension
  baseURL: grpc://{plugin-host}:{port}
  tags:
  - Artificial Intelligence
  - Business Intelligence
  - Extensibility
  - gRPC
  - Machine-Learning
  - Protobuf
  tags_raw:
