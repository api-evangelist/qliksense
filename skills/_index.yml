description: >-
  Packaged Agent Skills for Qlik Cloud. Qlik is one of the few providers in the
  catalog that publishes Agent Skills itself rather than leaving them to be
  derived — official/ skills are Qlik-maintained, community/ skills pass a
  security scan and review before merge.
provider_hub:
  repo: https://github.com/qlik-oss/agentic-skills
  license: Apache-2.0
  specification: https://agentskills.io/specification
  install: npx skills add qlik-oss/agentic-skills
  claude_plugins:
    - qlik-cloud-skills@qlik-cloud-skills
    - qlik-cloud-community-skills@qlik-cloud-skills
  tiers: [official, community]
  note: >-
    Each provider skill ships a references/ directory alongside its SKILL.md in
    the source repo. Only the SKILL.md is mirrored here; the references were not
    copied.
