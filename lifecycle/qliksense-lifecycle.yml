description: 'Versioning, deprecation and availability posture for the Qlik Cloud API surface. Qlik is
  unusual in publishing deprecation as machine-readable data: every operation carries x-qlik-stability
  and x-qlik-visibility, 27 carry x-qlik-deprecated, and three declare RFC 8594 Sunset + Deprecation +
  Link response headers.'
versioning:
  scheme: path prefix, migrating to namespaces
  current: /api/v1/<resource>
  target: /api/<namespace>/<resource>
  namespaces:
  - analytics
  - core
  - ai
  - data-governance
  - machine-learning
  - telemetry
  docs: https://qlik.dev/apis/namespaces/
  notes: Qlik is removing v1 from the path and grouping resources under a context namespace, explicitly
    "to unlock versioning support in the future" — i.e. the platform does not have real API versioning
    today. Namespaced APIs ship in parallel with the legacy ones; each legacy API is then deprecated on
    the changelog with a stated minimum 12-month migration window. Events follow the same namespace rule.
deprecation:
  policy_url: https://qlik.dev/apis/namespaces/
  terms_url: https://qlik.dev/apis/api-policy/
  changelog: https://qlik.dev/changelog/
  notice_period: minimum 12 months from the changelog deprecation notice
  sunset_header: true
  sunset_header_standard: RFC 8594
  sunset_header_evidence: 'Three operations in openapi/qliksense-data-qualities.json declare sunset, deprecation
    and link response headers: POST /api/v1/data-qualities/computations (202), GET /api/v1/data-qualities/computations/{computationId}
    (200) and GET /api/v1/data-qualities/global-results (200). Coverage is 3 of 681 operations — the mechanism
    is in place but not applied across the deprecated surface.'
  machine_readable_flag: x-qlik-deprecated (boolean) on the operation object
  notes: Qlik's API policy reserves the right to make backwards-incompatible changes and directs developers
    to the changelog, but the concrete, dated commitment is the 12-month namespace migration notice.
stability:
  field: x-qlik-stability
  values:
    stable: 648
    locked: 33
  visibility_field: x-qlik-visibility
  visibility_values:
    public: 681
  note: Every published operation is marked public. "locked" marks operations whose shape Qlik has frozen.
    Qlik's API policy states plainly that use of any UNPUBLISHED API is a violation of the API terms,
    which makes the published/unpublished boundary contractual, not just advisory.
