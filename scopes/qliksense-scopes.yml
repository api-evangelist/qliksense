method: searched
source: https://qlik.dev/authenticate/oauth/scopes/ and https://qlik.dev/manage/access-control/scopes/
docs: https://qlik.dev/manage/access-control/scopes/
description: 'Qlik Cloud platform scopes, captured verbatim from Qlik''s own scope reference. Qlik uses ONE scope
  vocabulary for two purposes: limiting an OAuth token, and composing custom roles. The oauth flag below records
  which of the two a given scope is usable for. Scopes can only NARROW a token — they never grant a user access
  beyond the roles already assigned to them. These scopes are NOT derivable from the OpenAPI: none of the 78 published
  documents declares a securitySchemes block at all, so oauth2 flows and scopes are absent from the machine-readable
  contract and exist only in prose. That gap is recorded in conformance/qliksense-conformance.yml.'
flow:
  authorization_endpoint: https://{tenant}.{region}.qlikcloud.com/oauth/authorize
  token_endpoint: https://{tenant}.{region}.qlikcloud.com/oauth/token
  revocation_endpoint: https://{tenant}.{region}.qlikcloud.com/oauth/revoke
  metadata: https://{tenant}.{region}.qlikcloud.com/.well-known/oauth-authorization-server
  request_example: GET /oauth/authorize?scope=automations apps:read spaces:read identity.name:read
  delimiter: space
semantics:
  grouping: Administrator scopes (admin.*) grant tenant-wide access to resources the calling user may not hold named
    access to. User scopes grant access only to resources the user already has.
  hierarchy: Child scopes are narrower forms of their parent (apps -> apps:read, apps:export). The parent implies
    the children.
  allow_list: The authorization server grants every scope on the client's allow list even when the scope parameter
    is empty, but only those the user approved. Scopes must be named explicitly on the authorize request to be presented
    for approval.
  offline_access: offline_access is never granted implicitly and must be requested explicitly to obtain a refresh
    token.
  revocability: Users can remove previously approved scopes between authorizations, so clients must inspect the
    scopes actually present on a token.
