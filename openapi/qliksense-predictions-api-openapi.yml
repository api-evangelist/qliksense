      name: offset
      schema:
        type: integer
      example: 32
      required: false
      description: Number of rows to skip before getting page[size]
    aliasName:
      in: path
      name: aliasName
      schema:
        type: string
      required: true
      description: The name of the ML Deployment Alias that will be used to determine which model should be used to produce predictions
    batchPredictionId:
