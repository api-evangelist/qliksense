    BatchPredictionPatch:
      type: array
      items:
        type: object
        example:
          op: replace
          path: /name
          value: New Name
        required:
        - op
        - path
        - value
        properties:
          op:
            enum:
            - replace
            type: string
            description: All patch requests use the replace operation
          path:
            enum:
            - /name
            - /description
            - /dataSetId
            - /indexColumn
            - /applyDatasetChangeOnly
            - /ownerId
            - /writeback/spaceId
            - /writeback/format
