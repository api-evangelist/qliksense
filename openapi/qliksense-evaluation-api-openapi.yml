openapi: 3.2.0
info:
  title: Qliksense Evaluation API
  version: ''
  description: 'Operations tagged evaluation across 2 of this provider''s published API definitions: qliksense-analytics-apps.json, qliksense-apps.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{tenant}.{region}.qlikcloud.com
  variables:
    region:
      default: us
      description: The region the tenant is hosted in
    tenant:
      default: your-tenant
      description: Name of the tenant that will be called
tags:
- name: Evaluation
paths:
  /api/analytics/apps/{guid}/evaluations:
    get:
      tags:
      - Evaluation
      summary: List app evaluations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/evaluations'
          description: App evaluations retrieved successfully.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorError'
          description: Bad request. The request contains invalid or missing parameters.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorError'
          description: Access denied. You lack the required permissions to list evaluations for this app.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorError'
          description: The specified app was not found.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorError'
          description: Internal server error.
      parameters:
      - in: path
        name: guid
        schema:
          type: string
        example: abcdefghijklmnopq
        required: true
        description: The unique identifier of the app.
      - in: query
        name: all
        schema:
          type: boolean
        required: false
        description: When `true`, includes full evaluation details in each result. When `false`, detail fields are omitted.
      - in: query
        name: fileMode
        schema:
          type: boolean
        required: false
        description: When `true`, adds file download headers to the response.
      - in: query
        name: format
        schema:
          type: string
        required: false
        description: The output format for the response. Accepts `json` or `xml`.
      - in: query
        name: limit
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
        required: false
        description: Maximum number of results to return per page.
      - in: query
        name: next
        schema:
          type: string
        required: false
        description: A cursor token for fetching the next page of results.
      - in: query
        name: prev
        schema:
          type: string
        required: false
        description: A cursor token for fetching the previous page of results.
      - in: query
        name: sort
        schema:
          enum:
          - started
          - +started
          - -started
          type: string
        required: false
        description: The field to sort results by. Prefix with `-` for descending order or `+` for ascending.
      description: 'Returns a paginated list of historical evaluations for the specified app. Use

        the `next` and `prev` cursor values from the response links to navigate through

        pages of results.'
      operationId: getEvaluations
      x-qlik-stability: stable
      x-qlik-visibility: public
      x-qlik-deprecated: false
      x-qlik-replaces:
      - namespace: ''
        uniqueIdentifier: GET:/v1/apps/{guid}/evaluations
      x-qlik-tier:
        tier: '1'
        limit: 1000
    post:
      tags:
      - Evaluation
      summary: Queue an app evaluation
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/evaluation'
          description: App evaluation queued successfully.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorError'
          description: Bad request. The app identifier is missing or invalid.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorError'
          description: Access denied. You lack the required permissions to evaluate the app.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorError'
          description: The specified app was not found.
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorError'
          description: The rate limit has been exceeded.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorError'
          description: Internal server error.
      parameters:
      - in: path
        name: guid
        schema:
          type: string
        example: abcdefghijklmnopq
        required: true
        description: The unique identifier of the app to evaluate.
      description: 'Queues a performance and scalability evaluation for the specified app, scheduling

        it for execution by the evaluation engine. The evaluation measures object response

        times, CPU usage, document size, and data model metrics. Once queued, use the

        returned `id` with the retrieval operations to poll for results.'
      operationId: queueEvaluation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/evaluationRequest'
        required: false
        description: 'Optional evaluation settings. The body may be omitted entirely.

          '
      x-qlik-stability: stable
      x-qlik-visibility: public
      x-qlik-deprecated: false
      x-qlik-replaces:
      - namespace: ''
        uniqueIdentifier: POST:/v1/apps/{guid}/evaluations
      x-qlik-tier:
        tier: '2'
        limit: 100
    servers:
    - url: https://{tenant}.{region}.qlikcloud.com
      variables:
        region:
          default: us
          description: The region the tenant is hosted in
        tenant:
          default: your-tenant
          description: Name of the tenant that will be called
  /api/analytics/apps/evaluations/{baselineId}/compare/{comparisonId}:
    get:
      tags:
      - Evaluation
      summary: Compare two app evaluations
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/comparison'
          description: Comparison completed successfully.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorError'
          description: One or both of the specified app evaluations were not found.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorError'
          description: Internal server error.
      parameters:
      - in: path
        name: baselineId
        schema:
          type: string
        example: abcdefghijklmnopq
        required: true
        description: The unique identifier of the baseline app evaluation.
      - in: path
        name: comparisonId
        schema:
          type: string
        example: abcdefghijklmnopq
        required: true
        description: The unique identifier of the comparison app evaluation.
      - in: query
        name: all
        schema:
          type: boolean
        required: false
        description: When `true`, includes all comparison entries regardless of significance.
      - in: query
        name: format
        schema:
          type: string
        required: false
        description: The output format for the response. Accepts `json` or `xml`.
      description: 'Compares exactly two app evaluations, a baseline and a comparison, returning a structured

        diff of performance metrics between them. Use this operation to detect regressions

        after app changes or engine upgrades. Both evaluations must belong to the same app.'
      operationId: compareTwo
      x-qlik-stability: stable
      x-qlik-visibility: public
      x-qlik-deprecated: false
      x-qlik-replaces:
      - namespace: ''
        uniqueIdentifier: GET:/v1/apps/evaluations/{baseid}/actions/compare/{comparisonid}
      x-qlik-tier:
        tier: '1'
        limit: 1000
    servers:
    - url: https://{tenant}.{region}.qlikcloud.com
      variables:
        region:
          default: us
          description: The region the tenant is hosted in
        tenant:
          default: your-tenant
          description: Name of the tenant that will be called
  /api/analytics/apps/evaluations/{baselineId}/compare/{comparisonId}/actions/download:
    get:
      tags:
      - Evaluation
      summary: Download a comparison log
      responses:
        '200':
          content:
            application/xml: {}
            application/json:
              schema:
                $ref: '#/components/schemas/comparison'
          description: Comparison log retrieved successfully.
        '404':
          content:
            application/xml: {}
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorError'
          description: One or both of the specified app evaluations were not found.
        '500':
          content:
            application/xml: {}
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorError'
          description: Internal server error.
      parameters:
      - in: path
        name: baselineId
        schema:
          type: string
        example: abcdefghijklmnopq
        required: true
        description: The unique identifier of the baseline app evaluation.
      - in: path
        name: comparisonId
        schema:
          type: string
        example: abcdefghijklmnopq
        required: true
        description: The unique identifier of the comparison app evaluation.
      - in: header
        name: Accept
        schema:
          enum:
          - application/xml
          - application/json
          type: string
          default: application/xml
        description: The desired response format. Accepts `application/xml` (default) or `application/json`.
      description: 'Downloads a comparison log for the two specified app evaluations (baseline and comparison),

        defaulting to XML format. Use the `Accept` header to request JSON output instead.

        Both evaluations must belong to the same app.'
      operationId: downloadCompareTwo
      x-qlik-stability: stable
      x-qlik-visibility: public
      x-qlik-deprecated: false
      x-qlik-replaces:
      - namespace: ''
        uniqueIdentifier: GET:/v1/apps/evaluations/{baseid}/actions/compare/{comparisonid}/actions/download
      x-qlik-tier:
        tier: '1'
        limit: 1000
    servers:
    - url: https://{tenant}.{region}.qlikcloud.com
      variables:
        region:
          default: us
          description: The region the tenant is hosted in
        tenant:
          default: your-tenant
          description: Name of the tenant that will be called
  /api/analytics/apps/evaluations/{id}:
    get:
      tags:
      - Evaluation
      summary: Get an app evaluation
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/evaluation'
          description: App evaluation retrieved successfully.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorError'
          description: The specified app evaluation was not found.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorError'
          description: Internal server error.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        example: abcdefghijklmnopq
        required: true
        description: The unique identifier of the app evaluation to retrieve.
      - in: query
        name: all
        schema:
          type: boolean
        required: false
        description: When `true`, includes full app evaluation details in the response.
      - in: query
        name: format
        schema:
          type: string
        required: false
        description: The output format for the response. Accepts `json` or `xml`.
      description: 'Retrieves a single app evaluation by its unique identifier. Use the `all` parameter

        to include full evaluation details in the response.'
      operationId: getOneEvaluation
      x-qlik-stability: stable
      x-qlik-visibility: public
      x-qlik-deprecated: false
      x-qlik-replaces:
      - namespace: ''
        uniqueIdentifier: GET:/v1/apps/evaluations/{id}
      x-qlik-tier:
        tier: '1'
        limit: 1000
    servers:
    - url: https://{tenant}.{region}.qlikcloud.com
      variables:
        region:
          default: us
          description: The region the tenant is hosted in
        tenant:
          default: your-tenant
          description: Name of the tenant that will be called
  /api/analytics/apps/evaluations/{id}/actions/download:
    get:
      tags:
      - Evaluation
      summary: Download an app evaluation log
      responses:
        '200':
          content:
            application/xml: {}
            application/json:
              schema:
