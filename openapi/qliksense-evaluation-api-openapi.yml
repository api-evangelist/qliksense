          description: Internal server error.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        example: abcdefghijklmnopq
        required: true
        description: The unique identifier of the app evaluation to download.
      - in: header
        name: Accept
        schema:
          enum:
          - application/xml
          - application/json
          type: string
          default: application/xml
        description: The desired response format. Accepts `application/xml` (default) or `application/json`.
      description: 'Downloads the evaluation log for the specified app evaluation, defaulting to XML

        format. Use the `Accept` header to request JSON output instead.'
      operationId: downloadOneEvaluation
      x-qlik-stability: stable
      x-qlik-visibility: public
      x-qlik-deprecated: false
      x-qlik-replaces:
      - namespace: ''
        uniqueIdentifier: GET:/v1/apps/evaluations/{id}/actions/download
      x-qlik-tier:
        tier: '1'
        limit: 1000
    servers:
    - url: https://{tenant}.{region}.qlikcloud.com
      variables:
        region:
          default: us
          description: The region the tenant is hosted in
        tenant:
          default: your-tenant
          description: Name of the tenant that will be called
  /api/v1/apps/{guid}/evaluations:
    get:
      tags:
      - Evaluation
      summary: Retrieve a list of all historic evaluations for an app GUID
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/evaluations_2'
          description: Evaluation(s) retrieved successfully.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorError_2'
          description: Bad request.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorError_2'
          description: Not Found.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluatorError_2'
          description: Internal server error.
      parameters:
      - in: path
        name: guid
        schema:
          type: string
        example: abcdefghijklmnopq
        required: true
        description: The app guid.
      - in: query
        name: all
        schema:
          type: boolean
        required: false
        description: Get the full data of the evaluation
      - in: query
        name: fileMode
        schema:
          type: boolean
        required: false
        description: Add file transfer headers to response
      - in: query
        name: format
        schema:
          type: string
        required: false
        description: Specify output format, currently supported are 'json' and 'xml'
      - in: query
        name: limit
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
        required: false
        description: Number of results to return per page.
      - in: query
        name: next
        schema:
          type: string
        required: false
        description: The app evaluation id to get next page from
      - in: query
        name: prev
        schema:
          type: string
        required: false
        description: The app evaluation id to get previous page from
      - in: query
        name: sort
        schema:
          type: string
        required: false
        description: Property to sort list on
      description: 'Find all evaluations for an app GUID.

        Supports paging via next, prev which are sent in the response body'
      operationId: evaluation#getEvaluations
      x-qlik-stability: stable
      x-qlik-deprecated: true
      x-qlik-visibility: public
      x-qlik-deprecated-sunset: 2026-09
      x-qlik-deprecated-version: 2026-06
      x-qlik-deprecated-description: Replaced by namespaced API
      x-qlik-replaced-by:
      - namespace: analytics
        uniqueIdentifier: GET:/analytics/apps/{guid}/evaluations
      x-qlik-tier:
        tier: '1'
        limit: 1000
    post:
