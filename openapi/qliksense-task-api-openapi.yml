openapi: 3.2.0
info:
  title: Qliksense Task API
  version: ''
  description: 'Operations tagged task across 2 of this provider''s published API definitions: qliksense-scheduling-tasks.json, qliksense-tasks.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{tenant}.{region}.qlikcloud.com
  variables:
    region:
      default: us
      description: The region the tenant is hosted in
    tenant:
      default: your-tenant
      description: Name of the tenant that will be called
tags:
- name: Task
paths:
  /api/scheduling/tasks:
    get:
      tags:
      - Task
      summary: List tasks
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
          description: Tasks retrieved successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - in: query
        name: filter
        schema:
          type: string
        required: false
        description: 'Advanced filter expression using RFC 7644 SCIM syntax. Refer to [RFC 7644](https://datatracker.ietf.org/doc/rfc7644/) for syntax details. All comparisons are case-insensitive. Supported fields: `name`, `enabled`, `resourceId`, `ownerId`, `spaceId`, `createdAt`, `updatedAt`, `updatedBy`, `lastStatus`, `lastTriggeredBy`, `lastStartedAt`, `lastEndedAt`, `lastExecutedAs`, and `triggerType`.

          '
      - in: query
        name: limit
        schema:
          type: integer
          default: 20
          maximum: 100
          minimum: 1
        required: false
        description: Maximum number of tasks to return per page.
      - in: query
        name: page
        schema:
          type: string
        required: false
        description: Cursor token for fetching the next page of results.
      - in: query
        name: resourceId
        schema:
          type: string
        required: false
        description: The unique identifier of the resource to filter tasks by.
      - in: query
        name: sort
        schema:
          enum:
          - +createdAt
          - -createdAt
          - +enabled
          - -enabled
          - +name
          - -name
          - +ownerId
          - -ownerId
          - +resourceId
          - -resourceId
          - +spaceId
          - -spaceId
          - +updatedAt
          - -updatedAt
          - +updatedBy
          - -updatedBy
          - +lastStatus
          - -lastStatus
          - +lastTriggeredBy
          - -lastTriggeredBy
          - +lastStartedAt
          - -lastStartedAt
          - +lastEndedAt
          - -lastEndedAt
          - +lastExecutedAs
          - -lastExecutedAs
          - +triggerType
          - -triggerType
          type: string
          default: -updatedAt
        required: false
        description: 'Field and direction to sort results by. Prefix the field name with

          `+` for ascending or `-` for descending order. Defaults to `-updatedAt`.

          '
      description: Retrieves a paginated list of tasks the requesting user has access to. Results include task metadata such as owner, resource, space, and last run status. Use the `filter` parameter to narrow results by field values, or `sort` to control the ordering.
      operationId: listTasks
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-replaces:
      - namespace: ''
        uniqueIdentifier: GET:/v1/tasks
      x-qlik-tier:
        tier: '1'
        limit: 1000
    post:
      tags:
      - Task
      summary: Create a task
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: Task created successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters: []
      description: Creates a new task for the specified resource. The task is owned by the requesting user and is disabled by default until explicitly enabled. The `resourceId` is derived automatically from the task's state definitions and cannot be set directly in the request body.
      operationId: createTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
            examples:
              objectExample:
                $ref: '#/components/examples/createSingleEventTriggerTask'
        required: true
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-replaces:
      - namespace: ''
        uniqueIdentifier: POST:/v1/tasks
      x-qlik-tier:
        tier: '2'
        limit: 100
    servers:
    - url: https://{tenant}.{region}.qlikcloud.com
      variables:
        region:
          default: us
          description: The region the tenant is hosted in
        tenant:
          default: your-tenant
          description: Name of the tenant that will be called
  /api/scheduling/tasks/{id}:
    get:
      tags:
      - Task
      summary: Get a task
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: Task details retrieved successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
        description: The unique identifier of the task to retrieve.
      description: Retrieves the full definition and metadata for a specific task, including its trigger configuration, state definitions, owner, and last run status. Use this operation to inspect a task before updating or starting it.
      operationId: getTask
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-replaces:
      - namespace: ''
        uniqueIdentifier: GET:/v1/tasks/{id}
      x-qlik-tier:
        tier: '1'
        limit: 1000
    patch:
      tags:
      - Task
      summary: Patch a task
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: Task updated successfully.
        '204':
          description: Task updated with no content to return.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
        description: The unique identifier of the task to update.
      description: Partially updates a specific task using a JSON Patch document (RFC 6902). Only the fields included in the patch operations are modified. All other fields remain unchanged. If the task is owned by another user, ownership is transferred to the requesting user.
      operationId: patchTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JSONPatch'
        required: true
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-tier:
        tier: '2'
        limit: 100
    put:
      tags:
      - Task
      summary: Replace a task
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
          description: Task replaced successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
        description: The unique identifier of the task to replace.
      description: Replaces the full definition of a specific task with the supplied payload. All fields not included in the request body are reset to their defaults. If the task is owned by another user, ownership is transferred to the requesting user. Use `PATCH` instead to apply a partial update.
      operationId: updateTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task'
        required: true
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-replaces:
      - namespace: ''
        uniqueIdentifier: PUT:/v1/tasks/{id}
      x-qlik-tier:
        tier: '2'
        limit: 100
    delete:
      tags:
      - Task
      summary: Delete a task
      responses:
        '204':
          description: Task deleted successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
        description: The unique identifier of the task to delete.
      description: Deletes a specific task and cancels any scheduled or pending runs associated with it. This action cannot be undone. Tenant admins can delete tasks owned by other users.
      operationId: deleteTask
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-replaces:
      - namespace: ''
        uniqueIdentifier: DELETE:/v1/tasks/{id}
      x-qlik-tier:
        tier: '2'
        limit: 100
    servers:
    - url: https://{tenant}.{region}.qlikcloud.com
      variables:
        region:
          default: us
          description: The region the tenant is hosted in
        tenant:
          default: your-tenant
          description: Name of the tenant that will be called
  /api/scheduling/tasks/{id}/actions/start:
    post:
      tags:
      - Task
      summary: Start a task
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Task started successfully
          description: Task started successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
        description: The unique identifier of the task to start.
      - in: query
        name: source
        schema:
          type: string
          default: manual
        required: false
        description: 'The origin of the trigger. Defaults to `manual`. For event-triggered tasks, this can be the name of the triggering task.

          '
      description: Triggers an immediate run of the specified task outside its normal schedule. The optional `source` parameter identifies what initiated the run, which is recorded in the run history for auditing purposes.
      operationId: startTask
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-replaces:
      - namespace: ''
        uniqueIdentifier: POST:/v1/tasks/{id}/actions/start
      x-qlik-tier:
        tier: '2'
        limit: 100
    servers:
    - url: https://{tenant}.{region}.qlikcloud.com
      variables:
        region:
          default: us
          description: The region the tenant is hosted in
        tenant:
          default: your-tenant
          description: Name of the tenant that will be called
  /api/scheduling/tasks/{id}/runs:
    get:
      tags:
      - Task
      summary: List task runs
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchRunList'
          description: Task runs retrieved successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
        description: The unique identifier of the task.
      - in: query
        name: limit
        schema:
          type: integer
          default: 20
          maximum: 100
          minimum: 1
        required: false
        description: Maximum number of task runs to return per page.
      - in: query
        name: page
        schema:
          type: string
        required: false
        description: Cursor token for fetching the next page of results.
      - in: query
        name: sort
        schema:
          enum:
          - +startedAt
          - -startedAt
          - +endedAt
          - -endedAt
          - +status
          - -status
          - +taskId
          - -taskId
          - +actionId
          - -actionId
          type: string
          default: -startedAt
        required: false
        description: 'Field and direction to sort results by. Prefix the field name with `+` for ascending or `-` for descending order. Defaults to `-startedAt`.

          '
      description: Retrieves a paginated list of execution runs for the specified task, ordered by most recent run by default. Each run record includes the start and end time, status, and the identity that triggered it.
      operationId: getTaskRuns
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-replaces:
      - namespace: ''
        uniqueIdentifier: GET:/v1/tasks/{id}/runs
      x-qlik-tier:
        tier: '1'
        limit: 1000
    servers:
    - url: https://{tenant}.{region}.qlikcloud.com
      variables:
        region:
          default: us
          description: The region the tenant is hosted in
        tenant:
          default: your-tenant
          description: Name of the tenant that will be called
  /api/scheduling/tasks/{id}/runs/{runId}/log:
    get:
      tags:
      - Task
      summary: Get task run log
      responses:
        '200':
          content:
            text/plain:
              schema:
                type: object
                properties:
                  logContent:
                    type: string
                    example: Task run log content
            application/json:
              schema:
                type: object
                properties:
                  logContent:
                    type: string
                    example: Task run log content
                    description: Log content in plain text format.
          description: Task run log retrieved successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
        description: The unique identifier of the task.
      - in: path
        name: runId
        schema:
          type: string
        required: true
        description: The unique identifier of the task run.
      - in: header
        name: Accept
        schema:
          enum:
          - application/json
          - text/plain
          type: string
          default: application/json
        required: false
        description: The preferred response format for the log content.
      description: Retrieves the execution log for a specific task run. Set the `Accept` header to `text/plain` to receive the raw log as a downloadable file, or `application/json` (default) to receive it wrapped in a JSON object with a `logContent` field.
      operationId: getTaskRunLog
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-replaces:
      - namespace: ''
        uniqueIdentifier: GET:/v1/tasks/{id}/runs/{runId}/log
      x-qlik-tier:
        tier: '1'
        limit: 1000
    servers:
    - url: https://{tenant}.{region}.qlikcloud.com
      variables:
        region:
          default: us
          description: The region the tenant is hosted in
        tenant:
          default: your-tenant
          description: Name of the tenant that will be called
  /api/scheduling/tasks/{id}/runs/last:
    get:
      tags:
      - Task
      summary: Get last task run
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchRun'
          description: Last task run retrieved successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
        description: The unique identifier of the task.
      description: Retrieves the most recent execution run for the specified task. Returns a 404 response if the task has never been run. Use this operation to quickly check whether the last run succeeded or failed without paginating through the full run history.
      operationId: getTaskLastRun
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-replaces:
      - namespace: ''
        uniqueIdentifier: GET:/v1/tasks/{id}/runs/last
      x-qlik-tier:
        tier: '1'
        limit: 1000
    servers:
    - url: https://{tenant}.{region}.qlikcloud.com
      variables:
        region:
          default: us
          description: The region the tenant is hosted in
        tenant:
          default: your-tenant
          description: Name of the tenant that will be called
  /api/scheduling/tasks/resources/{id}/runs:
    get:
      tags:
      - Task
      summary: List task runs for a resource
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrchRunList'
          description: Task runs retrieved successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
        description: The unique identifier of the resource to retrieve task runs for.
      - in: query
        name: limit
        schema:
          type: integer
          default: 20
          maximum: 100
          minimum: 1
        required: false
        description: Maximum number of task runs to return per page.
      - in: query
        name: page
        schema:
          type: string
        required: false
        description: Cursor token for fetching the next page of results.
      - in: query
        name: sort
        schema:
          enum:
          - +startedAt
          - -startedAt
          - +endedAt
          - -endedAt
          - +status
          - -status
          - +taskId
          - -taskId
          - +actionId
          - -actionId
          type: string
          default: -startedAt
        required: false
        description: 'Field and direction to sort results by. Prefix the field name with `+` for ascending or `-` for descending order. Defaults to `-startedAt`.

          '
      description: Retrieves a paginated list of task runs for a given resource, identified by `id`. Returns run history across all tasks associated with that resource, ordered by the most recent run by default.
      operationId: getResourceRuns
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-replaces:
      - namespace: ''
        uniqueIdentifier: GET:/v1/tasks/resources/{id}/runs
      x-qlik-tier:
        tier: '1'
        limit: 1000
    servers:
    - url: https://{tenant}.{region}.qlikcloud.com
      variables:
        region:
          default: us
          description: The region the tenant is hosted in
        tenant:
          default: your-tenant
          description: Name of the tenant that will be called
  /api/v1/tasks:
    get:
      tags:
      - Task
      summary: List tasks
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskList'
          description: OK Response
        '400':
          $ref: '#/components/responses/BadRequest_2'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '403':
          $ref: '#/components/responses/Forbidden_2'
        '404':
          $ref: '#/components/responses/NotFound_2'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
        '503':
          $ref: '#/components/responses/ServiceUnavailable_2'
      parameters:
      - in: query
        name: limit
        schema:
          type: integer
          default: 20
          maximum: 100
          minimum: 1
        required: false
        description: The maximum number of resources to return for a request.
      - in: query
        name: page
        schema:
          type: string
        required: false
        description: The page cursor.
      - in: query
        name: resourceId
        schema:
          type: string
        required: false
        description: 'Filter tasks by its target resource ID.

          '
      - in: query
        name: sort
        schema:
          enum:
          - +createdAt
          - -createdAt
          - +updatedAt
          - -updatedAt
          type: string
          default: -updatedAt
        required: false
        description: 'The property of a resource to sort on (default sort is

          -updatedAt). A property must be prefixed by + or - to

          indicate ascending or descending sort order respectively.

          '
      description: Retrieves a list of the tasks that the requesting user has access to.
      operationId: ListTasks
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-replaced-by:
      - namespace: scheduling
        uniqueIdentifier: GET:/scheduling/tasks
      x-qlik-tier:
        tier: special
        limit: 600
    post:
      tags:
      - Task
      summary: Create a task
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task_2'
          description: OK Response
        '400':
          $ref: '#/components/responses/BadRequest_2'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '403':
          $ref: '#/components/responses/Forbidden_2'
        '404':
          $ref: '#/components/responses/NotFound_2'
        '500':
          $ref: '#/components/responses/InternalServerError_2'
        '503':
          $ref: '#/components/responses/ServiceUnavailable_2'
      parameters:
      - in: query
        name: migrateFrom
        schema:
          type: string
        required: false
        description: ID of the reload-task to migrate from the old system (optional).
      description: Creates a new task.
      operationId: CreateTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Task_2'
            examples:
              objectExample:
                $ref: '#/components/examples/Task'
        required: true
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-replaced-by:
      - namespace: scheduling
        uniqueIdentifier: POST:/scheduling/tasks
      x-qlik-tier:
        tier: special
        limit: 600
    servers:
    - url: https://{tenant}.{region}.qlikcloud.com
      variables:
        region:
          default: us
          description: The region the tenant is hosted in
        tenant:
          default: your-tenant
          description: Name of the tenant that will be called
  /api/v1/tasks/{id}:
    get:
      tags:
      - Task
      summary: Get a task
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task_2'
          description: OK Response
        '400':
          $ref: '#/components/responses/BadRequest_2'
        '401':
