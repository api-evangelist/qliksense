openapi: 3.2.0
info:
  title: ml Experiments API
  version: ''
servers:
- url: https://{tenant}.{region}.qlikcloud.com
  variables:
    region:
      default: us
      description: The region the tenant is hosted in
    tenant:
      default: your-tenant
      description: Name of the tenant that will be called
tags:
- name: Experiments
paths:
  /api/v1/ml/experiments:
    get:
      tags:
      - Experiments
      summary: List experiments
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentFindResponse'
          description: '`OK`'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalError'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        default:
          $ref: '#/components/responses/FailureDefault'
      parameters:
      - $ref: '#/components/parameters/experimentsFilter'
      - $ref: '#/components/parameters/experimentsSort'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      description: 'Retrieves a list of experiments based on provided filter and sort

        parameters.'
      operationId: getExperiments
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-tier:
        tier: '1'
        limit: 1000
    post:
      tags:
      - Experiments
      summary: Create an experiment
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentPostResponse'
          description: '`Created`'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalError'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        default:
          $ref: '#/components/responses/FailureDefault'
      operationId: postExperiment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentInput'
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-tier:
        tier: '2'
        limit: 100
  /api/v1/ml/experiments/{experimentId}:
    get:
      tags:
      - Experiments
      summary: Get an experiment
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentGetResponse'
          description: '`OK`'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalError'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        default:
          $ref: '#/components/responses/FailureDefault'
      parameters:
      - $ref: '#/components/parameters/experimentId'
      operationId: getExperiment
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-tier:
        tier: '1'
        limit: 1000
    patch:
      tags:
      - Experiments
      summary: Update an experiment
      responses:
        '204':
          $ref: '#/components/responses/204NoContent'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalError'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        default:
          $ref: '#/components/responses/FailureDefault'
      parameters:
      - $ref: '#/components/parameters/experimentId'
      operationId: patchExperiment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentPatch'
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-tier:
        tier: '2'
        limit: 100
    delete:
      tags:
      - Experiments
      summary: Delete an experiment
      responses:
        '204':
          $ref: '#/components/responses/204NoContent'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalError'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        default:
          $ref: '#/components/responses/FailureDefault'
      parameters:
      - $ref: '#/components/parameters/experimentId'
      operationId: deleteExperiment
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-tier:
        tier: '2'
        limit: 100
  /api/v1/ml/experiments/{experimentId}/actions/recommend-models:
    post:
      tags:
      - Experiments
      summary: Request model recommendations for an experiment
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentModelRecommendationPostResponse'
          description: '`OK`'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '500':
          $ref: '#/components/responses/500InternalError'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        default:
          $ref: '#/components/responses/FailureDefault'
      parameters:
      - $ref: '#/components/parameters/experimentId'
      description: Returns model recommendations for a specified experiment, including the best-performing, fastest, and most accurate models based on evaluation metrics.
      operationId: postExperimentRecommendModels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentModelRecommendationFilter'
      x-qlik-stability: stable
      x-qlik-visibility: public
      x-qlik-deprecated: false
      x-qlik-tier:
        tier: '2'
        limit: 100
  /api/v1/ml/experiments/{experimentId}/models:
    get:
      tags:
      - Experiments
      summary: List models
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelFindResponse'
          description: '`OK`'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalError'
        default:
          $ref: '#/components/responses/FailureDefault'
      parameters:
      - $ref: '#/components/parameters/experimentId'
      - $ref: '#/components/parameters/modelsFilter'
      - $ref: '#/components/parameters/modelsSort'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      operationId: getExperimentModels
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-tier:
        tier: '1'
        limit: 1000
  /api/v1/ml/experiments/{experimentId}/models/{modelId}:
    get:
      tags:
      - Experiments
      summary: Get a model
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelGetResponse'
          description: '`OK`'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalError'
        default:
          $ref: '#/components/responses/FailureDefault'
      parameters:
      - $ref: '#/components/parameters/experimentId'
      - $ref: '#/components/parameters/modelId'
      operationId: getExperimentModel
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-tier:
        tier: '1'
        limit: 1000
  /api/v1/ml/experiments/{experimentId}/versions:
    get:
      tags:
      - Experiments
      summary: List experiment versions
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentVersionFindResponse'
          description: '`OK`'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalError'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        default:
          $ref: '#/components/responses/FailureDefault'
      parameters:
      - $ref: '#/components/parameters/experimentId'
      - $ref: '#/components/parameters/experimentVersionsFilter'
      - $ref: '#/components/parameters/experimentVersionsSort'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/offset'
      operationId: getExperimentVersions
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-tier:
        tier: '1'
        limit: 1000
    post:
      tags:
      - Experiments
      summary: Create an experiment version
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentVersionPostResponse'
          description: '`Accepted`'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalError'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        default:
          $ref: '#/components/responses/FailureDefault'
      parameters:
      - $ref: '#/components/parameters/experimentId'
      description: 'Creates an experiment version.

        Poll this version and check its `status` field to determine when models

        are finished training.'
      operationId: postExperimentVersion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentVersionInput'
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-tier:
        tier: '2'
        limit: 100
  /api/v1/ml/experiments/{experimentId}/versions/{experimentVersionId}:
    get:
      tags:
      - Experiments
      summary: Get an experiment version
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExperimentVersionGetResponse'
          description: '`OK`'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalError'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        default:
          $ref: '#/components/responses/FailureDefault'
      parameters:
      - $ref: '#/components/parameters/experimentId'
      - $ref: '#/components/parameters/experimentVersionId'
      operationId: getExperimentVersion
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-tier:
        tier: '1'
        limit: 1000
    patch:
      tags:
      - Experiments
      summary: Update an experiment version
      responses:
        '204':
          $ref: '#/components/responses/204NoContent'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalError'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        default:
          $ref: '#/components/responses/FailureDefault'
      parameters:
      - $ref: '#/components/parameters/experimentId'
      - $ref: '#/components/parameters/experimentVersionId'
      operationId: patchExperimentVersion
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExperimentVersionPatch'
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-tier:
        tier: '2'
        limit: 100
    delete:
      tags:
      - Experiments
      summary: Delete an experiment version
      responses:
        '204':
          $ref: '#/components/responses/204NoContent'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '500':
          $ref: '#/components/responses/500InternalError'
        '502':
          $ref: '#/components/responses/502BadGateway'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
        default:
          $ref: '#/components/responses/FailureDefault'
      parameters:
      - $ref: '#/components/parameters/experimentId'
      - $ref: '#/components/parameters/experimentVersionId'
      operationId: deleteExperimentVersion
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-tier:
        tier: '2'
        limit: 100
components:
  schemas:
    EnumSortExperiments:
      enum:
      - createdAt
      - +createdAt
      - -createdAt
      - description
      - +description
      - -description
      - name
      - +name
      - -name
      - updatedAt
      - +updatedAt
      - -updatedAt
      type: string
    PreprocessedInsightColumn:
      type: object
      required:
      - name
      - insights
      - willBeDropped
      properties:
        name:
          type: string
          description: Name of the preprocessed insight column
        insights:
          type: array
          items:
            enum:
            - is_free_text
            - cannot_be_processed_as_free_text
            - is_date_engineered
            - has_target_leakage
            - feature_type_change_invalid
            - feature_type_change_failed
            - feature_type_change_successful
            - data_bias_detected
            - representation_bias_detected
            type: string
          default: []
          description: 'Preliminary list of column/feature insights available after

            preprocessing but before feature insights are available

            '
        willBeDropped:
          type: boolean
          description: 'Whether this feature insight will be dropped due to free text or

            high cardinality that makes it less useful

            '
      description: 'Metadata about features/columns from dataset after preprocessing

        '
      additionalProperties: false
    ModelMetricsTimeseries:
      type: object
      properties:
        mae:
          type: number
          description: Mean absolute error (training data)
        mape:
          type: number
          description: Mean absolute percentage error (training data)
        mase:
          type: number
          description: Mean absolute scaled error (training data)
        rmse:
          type: number
          description: Root mean squared error (training data)
        mdape:
          type: number
          description: Median absolute percentage error (training data)
        smape:
          type: number
          description: Symmetric mean absolute percentage error (training data)
        wmape:
          type: number
          description: Weighted mean absolute percentage error (training data)
        mnrmse:
          type: number
          description: Mean root mean squared error (training data)
        maeTest:
          type: number
          description: Mean absolute error (test data)
        mdnrmse:
          type: number
          description: Median root mean squared error (training data)
        mapeTest:
          type: number
          description: Mean absolute percentage error (test data)
        maseTest:
          type: number
          description: Mean absolute scaled error (test data)
        rmseTest:
          type: number
          description: Root mean squared error (test data)
        mdapeTest:
          type: number
          description: Median absolute percentage error (test data)
        smapeTest:
          type: number
          description: Symmetric mean absolute percentage error (test data)
        wmapeTest:
          type: number
          description: Weighted mean absolute percentage error (test data)
        mnrmseTest:
          type: number
          description: Mean root mean squared error (test data)
        mdnrmseTest:
          type: number
          description: Median root mean squared error (test data)
      description: 'Timeseries metrics experiments valid for timeseries forecasting.

        '
      additionalProperties: false
    DateIndexes:
      type: array
      items:
        type: string
      maxItems: 1
      minItems: 0
      description: A optional date column name to index
    ModelAlgorithmAbbreviation:
      enum:
      - CATBC
      - CATBR
      - ELNC
      - GNBC
      - LGBMC
      - LGBMR
      - LINR
      - LOGC
      - LSOC
      - RAFC
      - RAFR
      - SGDR
      - XGBC
      - XGBR
      type: string
      description: Model algorithm name abbreviation
    ResponseLinks:
      type: object
      required:
      - first
      - prev
      - self
      - next
      - last
      properties:
        last:
          type: object
          properties:
            href:
              type: string
              format: uri
              description: 'Link to the last set of responses from `limit` minus `offset` to

                `limit`

                '
        next:
          type: object
          properties:
            href:
              type: string
              format: uri
              description: 'Link to the next set of responses

                '
        prev:
          type: object
          properties:
            href:
              type: string
              format: uri
              description: 'Link to the previous set of responses

                '
        self:
          type: object
          properties:
            href:
              type: string
              format: uri
              description: 'Link to the current set of responses

                '
        first:
          type: object
          properties:
            href:
              type: string
              format: uri
              description: 'Link to the first set of responses from `offset` 0 to count `limit``

                '
      description: Resource links included in paginated responses
      additionalProperties: false
    ModelMetrics:
      type: object
      properties:
        binary:
          $ref: '#/components/schemas/ModelMetricsBinary'
        multiclass:
          $ref: '#/components/schemas/ModelMetricsMulticlass'
        regression:
          $ref: '#/components/schemas/ModelMetricsRegression'
        timeseries:
          $ref: '#/components/schemas/ModelMetricsTimeseries'
      description: 'Model metrics based on the type of model

        '
      additionalProperties: false
    FeatureType:
      enum:
      - categorical
      - numeric
      - date
      - freetext
      type: string
      description: 'The default feature type based on the feature''s data type.

        If you want a value to be interpreted differently (e.g. 0/1

        as categorical/boolean instead of numeric), use `changeType`.

        '
    Pipeline:
      type: object
      properties:
        transforms:
          type: array
          items:
            $ref: '#/components/schemas/Transform'
      description: 'Pipeline metadata including transformations to apply to columns and

        specific schema configuration data

        '
    ModelGetResponse:
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - type
          - id
          - attributes
          properties:
            id:
              $ref: '#/components/schemas/EntityId'
            type:
              enum:
              - model
              type: string
            attributes:
              $ref: '#/components/schemas/Model'
          additionalProperties: false
      additionalProperties: false
    Errors:
      type: array
      items:
        $ref: '#/components/schemas/APIError'
      example: '[{"code":"AML-145","title":"datasync dependent service error, service profile","errorId":"c1546687-ad5d-4002-87f6-8c9711298db1","meta":{"errorId":"c1546687-ad5d-4002-87f6-8c9711298db1"}}]

        '
      description: JSON string with list of error objects
    ExperimentVersion:
      type: object
      required:
      - id
      - createdAt
      - updatedAt
      - createdByUserId
      - experimentId
      - status
      - target
      - dataSetId
      - experimentType
      properties:
        id:
          $ref: '#/components/schemas/EntityId'
        name:
          $ref: '#/components/schemas/EntityName'
        errors:
          $ref: '#/components/schemas/Errors'
        status:
          enum:
          - ready
          - error
          - cancelled
          - pending
          - dataprep_requested
          - datasync_requested
          - datasync_done
          type: string
          default: pending
          description: Current status of this entity
          x-qlik-filterable: true
        target:
          type: string
          example: TargetColumn
          description: The target field in the dataset
        pipeline:
          $ref: '#/components/schemas/Pipeline'
        createdAt:
          $ref: '#/components/schemas/CreatedAt'
        dataSetId:
          $ref: '#/components/schemas/DataSetId'
        profileId:
          type: string
          description: ID of the dataset profile with metadata about source data
        updatedAt:
          $ref: '#/components/schemas/UpdatedAt'
        algorithms:
          type: array
          items:
            $ref: '#/components/schemas/ModelAlgorithm'
          description: 'List of algorithms selected for model training in this version

            '
        topModelId:
          type: string
          description: 'ID of the top model (based on training scores) in this experiment

            version

            '
        dateIndexes:
          $ref: '#/components/schemas/DateIndexes'
        errorMessage:
          $ref: '#/components/schemas/ErrorMessage'
        experimentId:
          $ref: '#/components/schemas/ExperimentId'
        featuresList:
          $ref: '#/components/schemas/FeaturesList'
        lastBatchNum:
          type: integer
          description: Number of the last batch
        datasetOrigin:
          $ref: '#/components/schemas/DatasetOrigin'
        versionNumber:
          type: integer
          description: 1-based sequential version number within the experiment
        experimentMode:
          $ref: '#/components/schemas/ExperimentMode'
        experimentType:
          $ref: '#/components/schemas/ExperimentType'
        createdByUserId:
          $ref: '#/components/schemas/OwnerId'
        trainingDuration:
          $ref: '#/components/schemas/TrainingDuration'
        preprocessedInsights:
          type: array
          items:
            $ref: '#/components/schemas/PreprocessedInsightColumn'
          description: 'Preprocessed insights. Like feature insights but with fewer details.

            '
      description: 'An AutoML experiment version. This is a configuration for training

        models within an experiment.

        '
      additionalProperties: false
    Transform:
      type: object
      required:
      - name
      - changeType
      properties:
        column:
          $ref: '#/components/schemas/ColumnTransform'
    DroppedFeature:
      type: object
      properties:
        name:
          type: string
          description: Name of dropped feature in the dataset
        reason:
          enum:
          - highly_correlated
          - has_target_leakage
          - is_date_engineered
          - feature_with_low_importance
          type: string
          description: Reason the feature was dropped
      description: Feature dropped during preprocessing
      additionalProperties: false
    FeaturesList:
      type: array
      items:
        $ref: '#/components/schemas/Feature'
      description: 'List of features from your dataset for creating Experiment

        Versions. This appears in from ProfileInsights response (in the

        defaultVersionConfig). You can adjust the default settings before

