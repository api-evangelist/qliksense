          description: The request is in incorrect format.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_2'
          description: User does not have valid authentication credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_2'
          description: User does not have access to the resource.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_2'
          description: Internal Server Error.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse_2'
          description: Requested service is not available.
      description: 'Triggers a full data quality computation for a dataset, running profile calculation followed by data quality

        assessment. Returns a `computationId` that can be used to track progress via the computation status endpoint

        (`GET /data-qualities/computations/{computationId}`). The computation runs asynchronously.

        Poll the status endpoint until `status` is `SUCCEEDED` or `FAILED`.'
      operationId: requestDataQualityComputation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataQualityComputationRequest'
        required: true
      x-qlik-stability: stable
      x-qlik-deprecated: true
      x-qlik-visibility: public
      x-qlik-replaced-by:
      - namespace: data-governance
        uniqueIdentifier: POST:/data-governance/data-qualities/computations
      x-qlik-tier:
        tier: special
        limit: 10
    servers:
    - url: https://{tenant}.{region}.qlikcloud.com
      variables:
        region:
          default: us
          description: The region the tenant is hosted in
        tenant:
          default: your-tenant
          description: Name of the tenant that will be called
  /api/v1/data-qualities/computations/{computationId}:
    get:
      tags:
      - computation
      summary: Get data quality computation status
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputationStatusResponse'
          headers:
            link:
              schema:
                type: string
            sunset:
              schema:
