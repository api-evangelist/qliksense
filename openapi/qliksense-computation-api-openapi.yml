components:
  schemas:
    ComputationErrorCode:
      enum:
      - DQ-100
      - DQ-110
      - DQ-120
      - DQ-121
      - DQ-130
      - DQ-140
      - DQ-150
      - DQ-200
      - DQ-300
      - DQ-310
      - DQ-320
      - DQ-400
      - DQ-500
      - DQ-160
      - DQ-330
      - DQ-170
      - DQ-171
      type: string
      description: Error code indicating the reason for failure.
    BatchComputationStatusResponse:
      type: object
      required:
      - batchComputationId
      - status
      - computationStatuses
      properties:
        status:
          $ref: '#/components/schemas/BatchComputationAggregatedStatus'
        batchComputationId:
          type: string
          description: The unique identifier of the batch computation.
        computationStatuses:
          type: array
          items:
            $ref: '#/components/schemas/BatchComputationDatasetStatusResponse'
          description: Status of each individual dataset computation within the batch.
      description: Status of a batch computation, including per-dataset breakdown.
    ComputationStatusResponse:
      type: object
      required:
      - status
      properties:
        status:
          $ref: '#/components/schemas/ExecutionStatus'
    SamplingConfiguration:
      type: object
      properties:
        sampleMode:
          enum:
          - ABSOLUTE
          - RELATIVE
          type: string
          example: ABSOLUTE
          description: Specifies how the dataset is sampled. `ABSOLUTE` represents a fixed number of rows, while `RELATIVE` refers to a percentage of the total dataset rows.
        sampleSize:
          type: integer
          format: int64
          example: 10000
          maximum: 100000
          minimum: 1
          description: The actual value of the selected sampling method size (either a fixed number for `ABSOLUTE` mode or a percentage for `RELATIVE` mode). Maximum allowed value for `ABSOLUTE` mode is `100000`.
        executionMode:
          enum:
          - PUSHDOWN
          - PULLUP
          type: string
          example: PULLUP
          description: Specifies where the data quality computation takes place. In `PUSHDOWN` mode, it runs within the Cloud Data Warehouse (e.g., Snowflake, Databricks), whereas in `PULLUP` mode, it runs in Qlik Cloud.
    ErrorResponse:
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error'
          description: List of errors that occurred.
        traceId:
          type: string
          description: Trace identifier for debugging purposes.
      description: Standard error response wrapper.
    DataQualityComputationRequest:
      type: object
      allOf:
      - type: object
        properties:
          datasetId:
            $ref: '#/components/schemas/DatasetIdType'
          connectionId:
            $ref: '#/components/schemas/ConnectionIdType'
      - $ref: '#/components/schemas/SamplingConfiguration'
      example:
        datasetId: 669144f5aa2d642638ef1dd0
        sampleMode: ABSOLUTE
        sampleSize: 10000
        connectionId: 2b855c3d-426c-4aac-90cf-0edf9fc294d3
        executionMode: PULLUP
      required:
      - datasetId
      description: 'Request payload for triggering a data quality computation. The `connectionId` is optional for file-based datasets.

        If none of the sampling parameters are provided, the following defaults apply:

        - `executionMode: PULLUP`

        - `sampleMode: ABSOLUTE`

        - `sampleSize: 1000`

        '
    ConnectionIdType:
      type: string
      example: 2b855c3d-426c-4aac-90cf-0edf9fc294d3
      pattern: ^[0-9a-zA-Z-]{1,36}$
      description: The ID of the connection
    DatasetIdType:
      type: string
      example: 669144f5aa2d642638ef1dd0
      pattern: ^[0-9a-zA-Z-]{1,36}$
      description: The ID of the dataset
    Error:
      type: object
      required:
      - code
      - title
      properties:
        code:
          type: string
          description: The error code identifying the type of error.
        title:
          type: string
          description: A short summary of the error.
        detail:
          type: string
          description: A human-readable explanation of the error.
      description: An individual error detail.
    ExecutionStatus:
      enum:
      - PROFILE_REQUESTED
      - PROFILE_FAILED
      - REQUESTED
      - SUBMITTED
      - SUCCEEDED
      - FAILED
      type: string
      example: SUCCEEDED
      description: Status of a data quality computation.
    ComputationResponse:
      type: object
      required:
      - computationId
      properties:
        computationId:
          type: string
          description: The unique identifier of the triggered computation. Use this value to poll for status.
      description: Response returned when a data quality computation is successfully triggered.
    BatchComputationDatasetStatusResponse:
      type: object
      required:
      - datasetId
      - status
      - computationId
      properties:
        status:
          $ref: '#/components/schemas/ExecutionStatus'
        datasetId:
          $ref: '#/components/schemas/DatasetIdType'
        errorCode:
          $ref: '#/components/schemas/ComputationErrorCode'
        computationId:
          type: string
          description: The unique identifier of the individual computation for this dataset.
      description: Status of a single dataset within a batch computation.
    BatchComputationAggregatedStatus:
      enum:
      - IN_PROGRESS
      - FINISHED
      type: string
      example: IN_PROGRESS
      description: Overall status aggregated across all datasets in the batch.
    SamplingConfiguration_2:
      type: object
      properties:
        sampleMode:
          enum:
          - ABSOLUTE
          - RELATIVE
          type: string
          description: Specifies how the dataset is sampled. `ABSOLUTE` represents a fixed number of rows, while `RELATIVE` refers to a percentage of the total dataset rows.
        sampleSize:
          type: integer
          format: int64
          maximum: 100000
          minimum: 1
          description: The actual value of the selected sampling method size (either a fixed number for `ABSOLUTE` mode or a percentage for `RELATIVE` mode). Maximum allowed value for `ABSOLUTE` mode is `100000`.
        executionMode:
          enum:
          - PUSHDOWN
          - PULLUP
          type: string
          description: Specifies where the data quality computation takes place. In `PUSHDOWN` mode, it runs within the Cloud Data Warehouse (e.g., Snowflake, Databricks), whereas in `PULLUP` mode, it runs in Qlik Cloud.
    ErrorResponse_2:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/Error_2'
        traceId:
          type: string
    ConnectionIdType_2:
      type: string
      pattern: ^[0-9a-zA-Z-]{1,36}$
      description: The ID of the connection
    DatasetIdType_2:
      type: string
      pattern: ^[0-9a-zA-Z-]{1,36}$
      description: The ID of the dataset
    Error_2:
      type: object
      properties:
        code:
          type: string
        title:
          type: string
        detail:
          type: string
    ExecutionStatus_2:
      enum:
      - PROFILE_REQUESTED
      - PROFILE_FAILED
      - REQUESTED
      - SUBMITTED
      - SUCCEEDED
      - FAILED
      type: string
