openapi: 3.2.0
info:
  title: Qliksense Computation API
  version: ''
  description: 'Operations tagged computation across 2 of this provider''s published API definitions: qliksense-data-governance-data-qualities.json, qliksense-data-qualities.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{tenant}.{region}.qlikcloud.com
  variables:
    region:
      default: us
      description: The region the tenant is hosted in
    tenant:
      default: your-tenant
      description: Name of the tenant that will be called
tags:
- name: computation
paths:
  /api/data-governance/data-qualities/batch-computations/{batchComputationId}:
    get:
      tags:
      - computation
      summary: Get batch computation status
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchComputationStatusResponse'
          description: Batch computation status retrieved successfully.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is in incorrect format.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: User does not have valid authentication credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: User does not have access to the resource.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Batch computation not found.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Requested service is not available.
      parameters:
      - in: path
        name: batchComputationId
        schema:
          type: string
          example: a3f1b2c4-5678-90ab-cdef-1234567890ab
          pattern: ^[a-zA-Z0-9-]{1,36}$
        required: true
        description: Batch computation ID for tracking progress of the overall data quality computations.
      description: Retrieves the status of a batch computation, including per-dataset statuses.
      operationId: getBatchComputationStatus
      x-qlik-stability: stable
      x-qlik-visibility: public
      x-qlik-deprecated: false
      x-qlik-tier:
        tier: '1'
        limit: 1000
    servers:
    - url: https://{tenant}.{region}.qlikcloud.com
      variables:
        region:
          default: us
          description: The region the tenant is hosted in
        tenant:
          default: your-tenant
          description: Name of the tenant that will be called
  /api/data-governance/data-qualities/computations:
    post:
      tags:
      - computation
      summary: Trigger data quality computation
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputationResponse'
          headers:
            location:
              schema:
                type: string
              description: URL to retrieve the computation status.
          description: Computation triggered. The response body contains the `computationId` for tracking progress.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is in incorrect format.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: User does not have valid authentication credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: User does not have access to the resource.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Requested service is not available.
      description: 'Triggers a full data quality computation for a dataset, running profile calculation followed by data quality

        assessment. Returns a `computationId` that can be used to track progress via the computation status endpoint

        (`GET /data-governance/data-qualities/computations/{computationId}`). The computation runs asynchronously.

        Poll the status endpoint until `status` is `SUCCEEDED` or `FAILED`.'
      operationId: requestDataQualityComputation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataQualityComputationRequest'
        required: true
      x-qlik-stability: stable
      x-qlik-visibility: public
      x-qlik-deprecated: false
      x-qlik-replaces:
      - namespace: ''
        uniqueIdentifier: POST:/v1/data-qualities/computations
      x-qlik-tier:
        tier: special
        limit: 10
    servers:
    - url: https://{tenant}.{region}.qlikcloud.com
      variables:
        region:
          default: us
          description: The region the tenant is hosted in
        tenant:
          default: your-tenant
          description: Name of the tenant that will be called
  /api/data-governance/data-qualities/computations/{computationId}:
    get:
      tags:
      - computation
      summary: Get data quality computation status
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputationStatusResponse'
          description: Current execution status of the computation.
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: The request is in incorrect format.
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: User does not have valid authentication credentials.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: User does not have access to the resource.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: No computation found with the specified `computationId`.
        '500':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Internal Server Error.
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Requested service is not available.
      parameters:
      - in: path
        name: computationId
        schema:
          type: string
          pattern: ^[a-zA-Z0-9-]{1,36}$
        example: 4db06daa-3117-412e-8fb4-b29c937f9a0e
        required: true
        description: The unique identifier of the computation, as returned by `POST /data-governance/data-qualities/computations`.
      description: 'Retrieves the current execution status of a data quality computation. Poll this endpoint after triggering a

        computation to determine when results are available. The `status` field returns one of `REQUESTED`,

        `SUBMITTED`, `PROFILE_REQUESTED`, `SUCCEEDED`, `FAILED`, or `PROFILE_FAILED`.'
      operationId: getDataQualityComputation
      x-qlik-stability: stable
      x-qlik-visibility: public
      x-qlik-deprecated: false
      x-qlik-replaces:
      - namespace: ''
        uniqueIdentifier: GET:/v1/data-qualities/computations/{computationId}
      x-qlik-tier:
        tier: '1'
        limit: 1000
    servers:
    - url: https://{tenant}.{region}.qlikcloud.com
      variables:
        region:
          default: us
          description: The region the tenant is hosted in
        tenant:
          default: your-tenant
          description: Name of the tenant that will be called
  /api/v1/data-qualities/computations:
    post:
      tags:
      - computation
      summary: Trigger data quality computation
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComputationResponse'
          headers:
            link:
              schema:
                type: string
            sunset:
              schema:
                type: string
                format: date-time
            Deprecation:
              schema:
                type: boolean
          description: Computation triggered. The response body contains the `computationId` for tracking progress.
        '400':
          content:
            application/json:
              schema:
