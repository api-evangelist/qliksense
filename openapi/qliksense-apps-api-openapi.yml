openapi: 3.2.0
info:
  title: Qliksense Apps API
  version: ''
  description: 'Operations tagged Apps across 2 of this provider''s published API definitions: qliksense-analytics-odag-apps.json, qliksense-apps.json. Each path carries the servers of the definition it was published in.'
servers:
- url: https://{tenant}.{region}.qlikcloud.com
  variables:
    region:
      default: us
      description: The region the tenant is hosted in
    tenant:
      default: your-tenant
      description: Name of the tenant that will be called
tags:
- name: Apps
paths:
  /api/analytics/odag-apps:
    get:
      tags:
      - Apps
      summary: List ODAG Analytics Applications by type
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OdagAppsResponseBodyV2'
          description: Successful response.
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorV2'
          description: Forbidden.
      parameters:
      - in: query
        name: appType
        schema:
          $ref: '#/components/schemas/AppTypeV2'
        required: true
        description: The type of ODAG Analytics Application.
      description: 'Retrieves ODAG Analytics Applications filtered by type: `selection` (used as entry points), `template` (source Analytics Application for generation), or `generated` (Analytics Applications created via ODAG requests).'
      operationId: getAppsV2
      x-qlik-visibility: public
      x-qlik-stability: stable
      x-qlik-deprecated: false
      x-qlik-tier:
        tier: '1'
        limit: 1000
    servers:
    - url: https://{tenant}.{region}.qlikcloud.com
      variables:
        region:
          default: us
          description: The region the tenant is hosted in
        tenant:
          default: your-tenant
          description: Name of the tenant that will be called
  /api/v1/apps:
    post:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NxApp'
          headers: {}
          description: OK
      description: Creates a new app.
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/CreateApp'
        required: true
        description: Attributes that the user wants to set in new app.
      x-qlik-access-control:
      - create
      x-qlik-visibility: public
      x-qlik-stability: locked
      x-qlik-deprecated: false
      x-qlik-tier:
        tier: '2'
        limit: 100
      tags:
      - Apps
      summary: Create api apps
      x-summary-source: derived
      operationId: postApiV1Apps
      x-operation-id-source: derived
    servers:
    - url: https://{tenant}.{region}.qlikcloud.com
      variables:
        region:
          default: us
          description: The region the tenant is hosted in
        tenant:
          default: your-tenant
          description: Name of the tenant that will be called
  /api/v1/apps/{appId}:
    get:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NxApp'
          headers: {}
          description: OK
      parameters:
      - in: path
        name: appId
        schema:
          type: string
        required: true
        description: Identifier of the app.
      description: Retrieves information for a specific app.
      x-qlik-access-control:
      - read
      x-qlik-visibility: public
      x-qlik-stability: locked
      x-qlik-deprecated: false
      x-qlik-tier:
        tier: '1'
        limit: 1000
      tags:
      - Apps
      summary: Get api apps by app id
      x-summary-source: derived
      operationId: getApiV1AppsByAppId
      x-operation-id-source: derived
    put:
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NxApp'
          headers: {}
          description: OK
      parameters:
      - in: path
        name: appId
        schema:
          type: string
        required: true
        description: Identifier of the app.
      description: Updates the information for a specific app.
      requestBody:
        content:
          '*/*':
            schema:
              $ref: '#/components/schemas/UpdateApp'
        required: true
        description: Attributes that user wants to set.
      x-qlik-access-control:
      - update
      x-qlik-visibility: public
      x-qlik-stability: locked
      x-qlik-deprecated: false
      x-qlik-tier:
        tier: '2'
        limit: 100
      tags:
      - Apps
      summary: Replace api apps by app id
      x-summary-source: derived
      operationId: putApiV1AppsByAppId
      x-operation-id-source: derived
    delete:
      responses:
        '200':
          content:
            application/json: {}
          headers: {}
          description: OK
      parameters:
      - in: path
        name: appId
        schema:
          type: string
        required: true
        description: Identifier of the app.
      description: Deletes a specific app.
      x-qlik-access-control:
      - delete
      x-qlik-visibility: public
      x-qlik-stability: locked
      x-qlik-deprecated: false
      x-qlik-tier:
        tier: '2'
        limit: 100
      tags:
      - Apps
      summary: Delete api apps by app id
      x-summary-source: derived
      operationId: deleteApiV1AppsByAppId
      x-operation-id-source: derived
    servers:
    - url: https://{tenant}.{region}.qlikcloud.com
      variables:
        region:
          default: us
          description: The region the tenant is hosted in
        tenant:
          default: your-tenant
          description: Name of the tenant that will be called
