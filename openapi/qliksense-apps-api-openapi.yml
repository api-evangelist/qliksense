      x-operation-id-source: derived
    put:
      responses:
        '200':
          content:
            application/json: {}
          headers: {}
          description: OK
        '403':
          headers: {}
          description: Forbidden
        '404':
          headers: {}
          description: Not Found
        '409':
          headers: {}
          description: Conflict
      parameters:
      - in: path
        name: appId
        schema:
          type: string
        required: true
        description: Unique application identifier.
      - in: path
        name: path
        schema:
          type: string
        required: true
        description: Path to file content.
      description: 'Stores the media content file.

        Returns OK if the bytes containing the media file content were successfully stored, or error in case of failure, lack of permission or file already exists on the supplied path.'
