          type: string
        required: true
        description: Unique application identifier.
      - in: path
        name: path
        schema:
          type: string
        required: true
        description: Path to file content.
      description: 'Gets media content from file.

        Returns a stream of bytes containing the media file content on success, or error if file is not found.'
      x-qlik-access-control:
      - read
      x-qlik-visibility: public
      x-qlik-stability: locked
      x-qlik-deprecated: false
      x-qlik-tier:
