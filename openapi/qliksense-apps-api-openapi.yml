      summary: Replace api apps by app id media files by path
      x-summary-source: derived
      operationId: putApiV1AppsByAppIdMediaFilesByPath
      x-operation-id-source: derived
    delete:
      responses:
        '200':
          content:
            application/json: {}
          headers: {}
          description: OK
        '403':
          headers: {}
          description: Forbidden
        '404':
          headers: {}
          description: Not Found
      parameters:
      - in: path
        name: appId
        schema:
          type: string
        required: true
        description: Unique application identifier.
      - in: path
        name: path
        schema:
          type: string
        required: true
        description: Path to file content.
      description: 'Deletes a media content file or complete directory.

        Returns OK if the bytes containing the media file (or the complete content of a directory) were successfully deleted, or error in case of failure or lack of permission.'
