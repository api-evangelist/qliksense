source: Derived from the 4xx/5xx responses of all 681 operations in the 78 OpenAPI 3.0.0 documents harvested from
  https://qlik.dev/specs/rest/, plus the coded error enumerations Qlik embeds in its response-schema descriptions.
  Envelope semantics cross-checked against https://qlik.dev/apis/rest/rate-limiting/.
description: 'Error catalog for the Qlik Cloud REST API. Qlik uses a JSON:API-shaped errors[] envelope, NOT RFC
  9457 problem+json — no operation in any published document declares application/problem+json. It also does not
  use ONE envelope: at least a dozen differently-named error schemas describe the same shape across the surface,
  which is the main machine-readability defect here.'
format: json-api-style errors array
rfc9457: false
rfc9457_evidence: 0 of 681 operations declare an application/problem+json response content type.
content_type: application/json
envelope:
  shape:
    errors:
    - code: string — the error code
      title: string — summary of the problem
      detail: string — human-readable explanation specific to this occurrence
      status: integer — HTTP status (present on some variants only)
      meta: object — additional properties relating to the error
      source:
        pointer: JSON Pointer to the property that caused the error
        parameter: the query parameter that caused the error
  required:
  - code
  - title
