engine_model:
  note: >-
    The REST entities above sit on top of a second, older object model exposed
    over WebSocket JSON-RPC by the Associative Engine (QIX): Doc, GenericObject,
    GenericDimension, GenericMeasure, GenericBookmark, GenericVariable, Field,
    Variable. That graph is fully described in
    json-rpc/qliksense-qix-openrpc.json (OpenRPC 1.0.0) and is what enigma.js,
    enigma-go and nebula.js talk to.
  contract: json-rpc/qliksense-qix-openrpc.json
  docs: https://qlik.dev/apis/json-rpc/qix/
