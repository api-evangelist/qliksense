method: derived
source: >-
  Derived from the id-reference fields and $ref links in the 78 OpenAPI 3.0.0
  documents in openapi/ (1,258 distinct component schemas), cross-checked
  against https://qlik.dev/manage/key-concepts/ and
  https://qlik.dev/apis/namespaces/.
docs: https://qlik.dev/manage/key-concepts/
notation: >-
  relationships use has_one / has_many / belongs_to with the foreign-key field
  name; direction is from the entity that owns the reference.
description: >-
  Entity-relationship graph behind the Qlik Cloud API. Three fields carry almost
  all of the structure: tenantId (65 schemas), spaceId (67) and ownerId (63).
  Everything in Qlik Cloud lives in a TENANT, is placed in a SPACE, and is owned
  by a USER — space membership plus role is what actually resolves authorization
  on nearly every call, which is why an agent that ignores spaceId will get 403s
  it cannot explain.
id_format:
  scheme: >-
    Opaque identifiers with NO type prefix. Qlik uses bare GUIDs (users,
    tenants, spaces, reloads) and 24-character hex object ids (apps, items). An
    id therefore does not tell you what it identifies — unlike prefix-typed
    schemes, you must know the endpoint you got it from.
  examples:
    tenantId: 103359ca-3579-4125-a0dc-d19531b53186
    userId: ad378d54-3e97-47c0-bc57-cd84dbb93fa2

