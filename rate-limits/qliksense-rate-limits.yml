specification: API Commons Rate Limits
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/RateLimits
provider: Qlik Sense APIs
providerId: qliksense
created: '2026-05-04'
modified: '2026-08-29'
generated: '2026-08-29'
method: searched
source: https://qlik.dev/apis/rest/rate-limiting/ for the tier model, the tenant formula and the 429/Retry-After
  contract; the per-operation limits are read from the x-qlik-tier extension carried by all 681 operations in the
  78 OpenAPI documents in openapi/.
description: Published Qlik Cloud API rate limits. REPLACES a fabricated scaffold written by the 2026-05-04 bulk
  sweep, which invented free/professional/enterprise tiers at 10/100/1000 rpm and X-RateLimit-* headers Qlik does
  not emit. Qlik's real model is per tier, per user, per tenant — and every plan gets the SAME limits; they are
  not negotiable per customer.
tags:
- Analytics
- Business Intelligence
- Cloud
- Rate Limiting
- Quotas
- Throttling
scope_model:
  evaluated_per: tier, per user, per tenant
  window: per minute, evaluated over a rolling 5-minute window to absorb bursts (tiers 1 and 2)
  plan_independent: true
  plan_note: '"All Qlik Cloud plans receive the same rate limit configuration. It''s not possible to customize this
    on a per-customer or per-tenant basis." — qlik.dev/apis/rest/rate-limiting/'
  tenant_formula: tenantRateLimit = (user rate limit) * (number of users in the tenant) * 0.5
  tenant_formula_example: A 100-user tenant on tier 1 may send 1,000 * 100 * 0.5 = 50,000 requests in the window.
headers:
  retryAfter: Retry-After
  limit: null
  remaining: null
  reset: null
  policy: null
  note: Retry-After (whole seconds) is the ONLY rate-limit header Qlik returns, and only on the 429. No X-RateLimit-*/RateLimit-*
    quota headers are emitted on successful responses, so a client cannot observe its remaining budget — it can
    only react after exhaustion. The per-operation tier IS machine-readable in the spec via x-qlik-tier, which partly
    compensates.
responseCodes:
  throttled: 429
  quotaExceeded: 429
error_body_example:
  errors:
  - code: HTTP-429
    title: API rate limit reached.
    detail: You need to wait 13 seconds until limit is lifted.
limits:
- tier: Tier 1
  scope: per-tier per-user per-tenant
  metric: requests_per_minute
  limit: 1000
  timeFrame: minute
  window: 5-minute rolling
  applies_to: the majority of GET requests
  operation_count: 275
- tier: Tier 2
  scope: per-tier per-user per-tenant
  metric: requests_per_minute
  limit: 100
  timeFrame: minute
  window: 5-minute rolling
  applies_to: endpoints that create, update and delete resources
  operation_count: 366
- tier: Special
  scope: per-operation
  metric: requests_per_minute
  limit: null
  timeFrame: minute
  applies_to: endpoints whose limit is published in the API specification itself
  operation_count: 40
  note: See special_endpoints[] below — limits observed range from 10 to 1,000 rpm.
