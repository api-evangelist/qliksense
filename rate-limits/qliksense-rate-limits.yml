blocking_behavior: A 429 blocks every endpoint in the SAME tier for the Retry-After duration. Endpoints in other
  tiers are unaffected.
policies:
- name: Retry-After
  description: Clients must wait the number of seconds in the Retry-After header before retrying. Qlik publishes
    worked retry examples for @qlik/api, Node.js and other clients.
- name: Toolkit handling
  description: Rate-limit handling is built into qlik-cli and into the Qlik Cloud Services / Qlik Platform Operations
    connectors in Qlik Automate.
- name: Error-response limits
  description: Qlik states that some endpoints carry ADDITIONAL rate limits on error responses.
- name: Subject to change
  description: Qlik states each tier's limits are subject to change.
- name: Unpublished endpoints
  description: Endpoints not documented on qlik.dev are private but may share a tier with published ones — so private
    traffic can consume a published endpoint's budget.
docs: https://qlik.dev/apis/rest/rate-limiting/
