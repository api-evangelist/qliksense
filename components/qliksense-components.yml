description: 'Client-side and embeddable UI surfaces Qlik publishes. These are distinct from the SDKs in packages/:
  an SDK calls the API, these RENDER Qlik analytics inside someone else''s application. This is the largest single
  part of Qlik''s developer surface by page count and the part its embedded-analytics and OEM business runs on.'
