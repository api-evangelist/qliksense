method: searched
source: >-
  https://qlik.dev/toolkits/ and https://qlik.dev/toolkits/sdks-tools-versions/ —
  Qlik's own SDK/tooling index and its versioning-and-lifecycle policy page.
  Every version/published pair below was read from the package registry's own
  metadata endpoint (registry.npmjs.org, pypi.org/pypi/<pkg>/json,
  api.nuget.org, proxy.golang.org, api.github.com/releases) on 2026-08-29, not
  from the docs page — the docs page renders shields.io badges rather than
  literal version strings.
description: >-
  First-party Qlik client libraries, SDKs and tooling for Qlik Cloud. Qlik
  publishes all of them from the qlik-oss GitHub organization under an
  Apache/MIT open-source posture, and states a semver policy plus an explicit
  discontinued list at https://qlik.dev/toolkits/sdks-tools-versions/.
notes:
  - >-
    CURRENCY FINDING: the two Python/TypeScript "Platform SDK" lines are the
    decayed ones. PyPI qlik-sdk last published 0.17.0 on 2023-09-08 (nearly
    three years stale against an API surface that shipped 243 changelog entries
    since), and Qlik itself labels it Experimental. The TypeScript @qlik/sdk was
    formally deprecated 2024-05-25 and reached end of life 2025-03-27; npm
    reports the latest version 0.28.0 as deprecated. @qlik/api is its supported
    replacement and is current.
  - >-
    enigma.js (npm) last published 2.14.0 on 2024-03-13 and its GitHub release
    stream stops at v2.11.0 (2023-03-10), yet Qlik lists it as Stable — the
    JSON-RPC/QIX protocol it wraps is itself long-stable, so this is low churn
    rather than abandonment.
  - >-
    The .NET SDK badge on qlik.dev/toolkits/sdks-tools-versions/ reads
    "release_date november 2024", but NuGet reports QlikSense.NetSDK 16.12.1
    published 2026-08-03. The docs badge is stale, not the package.
