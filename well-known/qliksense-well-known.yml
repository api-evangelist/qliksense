description: >-
  Well-known document probe for Qlik. NOTHING WAS SERVED — every path on every
  host returned 404. Both hosts answer 404 with a full HTML shell (qlik.dev is
  an Astro site, www.qlik.com a Next.js site), so the 404 code and the HTML body
  agree; there is no soft-200 masking a real document here.
  No WellKnown or SecurityTxt pointer is emitted in apis.yml as a result: this
  file records a measured absence, not a presence.
notes:
  - >-
    Qlik DOES serve /.well-known/oauth-authorization-server, but on the TENANT
    host, not on any host reachable without a customer tenant. It is documented
    at https://qlik.dev/apis/rest/.well-known/ with base URL
    https://{tenant}.{region}.qlikcloud.com and returns issuer, jwks_uri,
    token_endpoint, revocation_endpoint, authorization_endpoint,
    grant_types_supported and response_types_supported. Because {tenant} is
    customer-specific there is no anonymous URL to probe, so this is recorded
    from the documentation rather than from a fetch. See
    authentication/qliksense-authentication.yml.
  - >-
    Qlik publishes a security contact (security@qlik.com) and a responsible
    disclosure posture on https://www.qlik.com/us/trust and
    https://security.qlik.com/, but does not expose it as an RFC 9116
    /.well-known/security.txt on any probed host. See
    security/qliksense-vulnerability-disclosure.yml.
