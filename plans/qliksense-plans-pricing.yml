description: 'Published Qlik Cloud Analytics plans, read from Qlik''s own pricing page on 2026-08-29. REPLACES a
  fabricated scaffold written by the 2026-05-04 bulk sweep, which invented a free tier at 1,000 requests/month and
  per-tier API rate limits. Qlik has NO free tier and prices on DATA CAPACITY and USERS, not on API calls: the API
